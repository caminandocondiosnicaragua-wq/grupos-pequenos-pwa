</div><div class="eyebrow" style="margin-top:24px">Propuesta integral</div><h1>Grupos pequeños</h1><p class="lead">Fundamentos bíblicos, discipulado, liderazgo, metodología, implementación y evaluación.</p><div class="quote">No queremos solamente abrir casas para hacer reuniones; queremos abrir hogares para formar discípulos, involucrar a las personas, alcanzar la comunidad y levantar nuevos servidores y líderes.</div><div class="meta"><div><small>Institución</small><b>Instituto Teológico Interdenominacional de Nic.</b></div><div><small>Materia</small><b>Educación Cristiana</b></div><div><small>Docente</small><b>Rafael Cubas</b></div><div><small>Integrantes</small><b>Abdiel Adoniram Acevedo Castillo<br>Flor Estela Segura Hernández</b></div><div><small>Fecha</small><b>Viernes 11 de septiembre · 2026</b></div></div></div><img src="${A}grupo-casa.jpeg" alt="Grupo reunido en un hogar"></div></section>`],
['1. Planteamiento',`<section class="screen"><div class="eyebrow">01 · Punto de partida</div><h2>Planteamiento de la propuesta</h2><div class="grid2"><div class="card"><h3>Propósito</h3><p>Diseñar una propuesta integral para iniciar, desarrollar, cuidar, evaluar y reproducir grupos pequeños centrados en Cristo y orientados al discipulado.</p></div><div class="dark"><h3>Objetivo general</h3><p>Establecer un modelo de grupos pequeños que facilite edificación cristiana, discipulado intencional, vida comunitaria, evangelización, desarrollo de líderes y reproducción saludable.</p></div></div><h3 style="margin-top:28px">Objetivos específicos</h3><div class="grid">${['Definir bíblica y operativamente qué es un grupo pequeño.','Seleccionar y formar líderes con carácter, compromiso y habilidades.','Establecer una metodología participativa para las reuniones.','Crear procesos de cuidado y seguimiento.','Integrar evangelización y discipulado.','Formar aprendices y nuevos líderes.','Establecer supervisión, evaluación y mejora.','Medir resultados numéricos y evidencias de crecimiento espiritual y relacional.'].map((x,i)=>`<div class="card"><span class="icon">${['📖','👤','🗣️','❤️','🌎','🌱','🧭','📊'][i]}</span><p><b>${x}</b></p></div>`).join('')}</div></section>`],
['2. ¿Qué son?',`<section class="screen"><div class="eyebrow">02 · Comunidad</div><h2>¿Qué son los grupos pequeños?</h2><div class="hero"><div><p class="lead">La Biblia no utiliza la expresión moderna “grupo pequeño” como nombre técnico de un programa. Sí presenta patrones de comunidad relacional, discipulado, enseñanza, oración, servicio, cuidado mutuo y reuniones en hogares.</p><div class="quote">Una comunidad cristiana intencional y regular, suficientemente reducida para permitir participación, relaciones, cuidado y discipulado, vinculada a la misión de la iglesia local.</div><div class="card"><h3>McBride</h3><p>Define el grupo pequeño como una reunión voluntaria e intencional de tres a doce personas que se congregan regularmente con la meta compartida de mutua edificación cristiana y confraternidad.</p></div><div class="card" style="margin-top:12px"><h3>Grupo pequeño ≠ necesariamente célula</h3><p>Una iglesia puede utilizar grupos pequeños sin ser una iglesia celular. Aquí se incorporan elementos celulares cuando aportan al discipulado, evangelización, liderazgo y multiplicación.</p></div></div><img class="hero" src="${A}grupo-casa.jpeg" alt="Grupo reunido en casa"></div></section>`],
['3. Fundamento bíblico',`<section class="screen"><div class="eyebrow">03 · Estructura bíblica</div><h2>Las raíces del A.T.</h2><p class="lead">La vida comunitaria de Israel muestra una organización progresiva de relaciones y pertenencia que ayuda a comprender el fundamento comunitario estudiado por Neal F. McBride.</p><div class="ot-flow"><article class="ot-card"><div class="ot-icon">✦</div><h3>NACIÓN</h3><p>Los israelitas eran un grupo selecto y único entre la creación humana.</p><small>Deuteronomio 7:6</small></article><div class="ot-arrow">←</div><article class="ot-card"><div class="ot-icon">⌘</div><h3>TRIBU</h3><p>Los hijos de Israel estaban divididos en 12 hijos, 12 tribus de Israel.</p><small>Génesis 49 · Josué 13–22</small></article><div class="ot-arrow">←</div><article class="ot-card tall"><div class="ot-icon">♧</div><h3>FAMILIA O CLAN</h3><p>Las tribus se subdividían en grupos de parientes conocidos e incluían nietos y bisnietos.</p><small>Números 26:21–19</small></article><div class="ot-arrow">←</div><article class="ot-card"><div class="ot-icon">⌂</div><h3>CASA</h3><p>Los clanes o familias se subdividían por casa, incluyendo siervos y dependientes.</p><small>Génesis 50:8 · Deuteronomio 6:22</small></article></div><div class="dark ot-note"><h3>Del pueblo a la casa</h3><p>La estructura pasa de una comunidad amplia a unidades familiares más cercanas. Esta perspectiva ayuda a visualizar cómo la vida comunitaria puede organizarse en círculos de relación y cuidado.</p><span class="source-tag">Neal F. McBride · Cómo liderar grupos pequeños</span></div></section>`],
['4. Jesús y los Doce',`<section class="screen"><div class="eyebrow">04 · Modelo de discipulado</div><h2>Jesús y los Doce</h2><div class="hero"><div><p class="lead">No afirmamos que Jesús estableció el programa moderno de “grupos pequeños”. Presentamos su proceso progresivo de llamado, cercanía, formación y envío como un modelo bíblico de discipulado.</p><div class="timeline">${[['01','Simón y Andrés','Marcos 1:16–18'],['02','Jacobo y Juan','Marcos 1:19–20'],['03','Leví','Marcos 2:13–14'],['04','Los Doce','Marcos 3:13–14']].map(x=>`<div class="step"><div class="sn">${x[0]}</div><div class="sb"><b>${x[1]}</b><br>${x[2]}</div></div>`).join('')}</div></div><img src="${A}jesus-discipulos.jpeg" alt="Jesús con sus discípulos"></div><div class="dark" style="margin-top:20px"><h3>El camino del llamado</h3><div class="flow"><span class="node">Llamó a sí</span><span class="arrow">→</span><span class="node">Vinieron a él</span><span class="arrow">→</span><span class="node">Estuvieron con él</span><span class="arrow">→</span><span class="node">Los envió</span></div><p>Marcos 3:13–14 resume una dinámica: estar con Jesús y ser enviados a participar en la misión.</p></div></section>`],
['5. Los cuatro enfoques',`<section class="screen"><div class="eyebrow">05 · Estudio comparativo</div><h2>Los cuatro enfoques</h2><p class="lead">Cada autor aporta un énfasis particular. Aquí aparecen enumerados para distinguir con claridad los cuatro enfoques.</p><div class="approaches">${[['🔄','Joel Comiskey','Cómo dirigir un grupo celular con éxito',['Preparación y conducción del grupo','Participación, escucha y preguntas','Transparencia y vida compartida','Evangelización y misión','Multiplicación y supervisión']],['🎯','Joel Comiskey','Haciendo discípulos en la iglesia del siglo XXI',['Discipulado como propósito','Hogares y liderazgo plural','Evangelización y oración','Planificación y acompañamiento','Multiplicación y supervisión']],['📖','Gregory J. Ogden','Manual del discipulado',['Estudio bíblico conectado con la vida','Discusión y participación','Aplicación personal','Compromiso y capacitación','Evaluación del proceso']],['🤝','Neal F. McBride','Cómo liderar grupos pequeños',['Liderazgo siervo','Escucha y facilitación','Manejo del conflicto','Etapas del desarrollo grupal','Liderazgo compartido y evaluación']]].map((x,i)=>`<article class="approach" tabindex="0"><div class="approach-num">${i+1}</div><div class="icon" aria-hidden="true">${x[0]}</div><h3>${x[1]}</h3><p><b>${x[2]}</b></p><ul>${x[3].map(item=>`<li>${item}</li>`).join('')}</ul></article>`).join('')}</div><div class="quote">Los cuatro autores no presentan un sistema idéntico. La propuesta posterior distingue sus aportes y luego formula una síntesis propia.</div></section>`],
['6. Comparación',`<section class="screen"><div class="eyebrow">06 · Coincidencias y diferencias</div><h2>Comparación: similitudes y diferencias</h2><div class="grid2"><div><div class="dark"><h3>Coincidencias</h3></div><div class="list">${['El grupo necesita propósito espiritual.','El discipulado requiere relaciones y participación.','El líder necesita carácter y preparación.','La Biblia debe conectarse con la vida.','Las personas necesitan cuidado.','La misión puede integrarse al grupo.','Es necesario desarrollar nuevos líderes.','El proceso debe evaluarse.','La iglesia debe acompañar y supervisar.'].map(x=>`<div class="li"><span class="check">✓</span>${x}</div>`).join('')}</div></div><div><div class="card" style="background:#e9dfd0"><h3>Diferencias</h3></div><div class="list">${['Comiskey enfatiza más el sistema celular, evangelización y multiplicación.','El segundo Comiskey centra el modelo en hacer discípulos.','Ogden desarrolla con mayor detalle la intencionalidad, compromiso y aplicación.','McBride desarrolla con mayor profundidad liderazgo, facilitación y etapas grupales.'].map(x=>`<div class="li"><span class="check">•</span>${x}</div>`).join('')}</div></div></div></section>`],
['7. Metodología',`<section class="screen"><div class="eyebrow">07 · Síntesis propia</div><h2>Nuestra propuesta de metodología para grupos pequeños</h2><p class="lead">Un proceso de discipulado que conecta la Palabra con la vida.</p><div class="dark" style="margin-top:20px"><h3>Principio rector</h3><p>El grupo pequeño existe para formar discípulos de Jesús en una comunidad donde la Palabra se conoce, se conversa, se aplica, se vive, se comparte y se reproduce en otros.</p></div><div class="grid">${[['1','Orar y preparar','Poner el encuentro y a las personas delante de Dios.'],['2','Convocar','Propósito y expectativas claras.'],['3','Conectar','Construir confianza y compartir vida.'],['4','Estudiar','Comprender la Escritura.'],['5','Responder','Reflexión y diálogo.'],['6','Practicar','Acciones concretas de obediencia.'],['7','Formar','Aprendices y responsabilidades compartidas.'],['8','Reproducir','Cuando exista madurez.']].map(x=>`<div class="card"><span class="eyebrow">${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div><div class="flow"><span class="node">PALABRA</span><span class="arrow">→</span><span class="node">RELACIÓN</span><span class="arrow">→</span><span class="node">APLICACIÓN</span><span class="arrow">→</span><span class="node">SERVICIO</span><span class="arrow">→</span><span class="node">MISIÓN</span><span class="arrow">→</span><span class="node">FORMACIÓN</span><span class="arrow">→</span><span class="node">REPRODUCCIÓN</span></div><div class="quote">La estructura debe servir al discipulado, no convertirse en el objetivo. Los números son útiles, pero no sustituyen la evaluación espiritual y relacional.</div></section>`],
['8. Implementación',`<section class="screen"><div class="eyebrow">08 · Llevarlo a la práctica</div><h2>De la propuesta a la práctica</h2><p class="lead">Plan de implementación de los grupos pequeños.</p><div class="timeline">${[['01','Preparación pastoral','Definir visión, propósito, población, responsables, calendario, materiales y supervisión.'],['02','Selección de líderes','Identificar personas fieles, enseñables, dispuestas a servir y capaces de relacionarse.'],['03','Formación','Entrenar en Biblia, discipulado, facilitación, oración, cuidado, evangelización, conflictos y evaluación.'],['04','Grupos piloto','Iniciar pocos grupos, observar dificultades y ajustar.'],['05','Desarrollo','Mantener reuniones, seguimiento, acompañamiento y formación continua.'],['06','Reproducción','Formar aprendices, delegar y preparar nuevos líderes/grupos.'],['07','Evaluación','Revisar salud espiritual, relaciones, misión, liderazgo, asistencia y resultados.']].map(x=>`<div class="step"><div class="sn">${x[0]}</div><div class="sb"><b>${x[1]}</b><p>${x[2]}</p></div></div>`).join('')}</div><h3 style="margin-top:28px">8.1. ¿Qué necesitamos para comenzar?</h3><div class="grid">${['Visión pastoral clara','Responsable del ministerio','Líderes capacitados','Propósito escrito','Material bíblico coherente','Comunicación y seguimiento','Supervisor o mentor','Registro sencillo','Lugar adecuado','Plan de evaluación'].map(x=>`<div class="card"><span class="check">✓</span> <b>${x}</b></div>`).join('')}</div></section>`],
['9. Reunión',`<section class="screen"><div class="eyebrow">09 · Encuentro</div><h2>El recorrido de la reunión</h2><p class="lead">Un encuentro que conecta, forma y moviliza.</p><div class="hero"><div class="timeline">${[['01','Bienvenida','Aceptación','Saludo y conversación'],['02','Oración','Dependencia de Dios','Intercesión'],['03','Conexión','Compartir vida','Preguntas sobre la semana'],['04','Palabra','Comprender','Lectura y preguntas'],['05','Diálogo','Participación','Escuchar a todos'],['06','Aplicación','Obediencia','¿Qué haré?'],['07','Misión','Mirar hacia afuera','Orar / invitar / servir'],['08','Compromiso','Siguiente paso','Acción concreta'],['09','Oración final','Interceder y enviar','Necesidades']].map(x=>`<div class="step"><div class="sn">${x[0]}</div><div class="sb"><b>${x[1]}</b><br>${x[2]} · ${x[3]}</div></div>`).join('')}</div><img src="${A}grupo-participacion.jpeg" alt="Participación en grupo pequeño"></div></section>`],
['10. Líderes y funciones',`<section class="screen"><div class="eyebrow">10 · Servir y formar</div><h2>Formación y funciones de los líderes</h2><div class="hero"><div><p class="lead">El liderazgo se entiende como servicio, facilitación, cuidado y formación de otros.</p><div class="grid" style="grid-template-columns:1fr 1fr">${['Fiel a Dios y a los miembros','En crecimiento con Cristo','Comprometido con las personas','Servidor','Enseñable','Dispuesto a invertir tiempo','Capaz de escuchar y facilitar','Dispuesto a compartir liderazgo'].map(x=>`<div class="card"><span class="check">✓</span> <b>${x}</b></div>`).join('')}</div></div><img src="${A}formacion-lider.jpeg" alt="Formación de un líder"></div><h3 style="margin-top:28px">Roles dentro del grupo</h3><div class="roles"><div class="card role"><h3>🏠 Anfitrión</h3><p>Pone su hogar al servicio del grupo. Debe tener buen testimonio, vida coherente, hospitalidad y actitud de servicio. <b>No necesita ser líder ni tener amplios conocimientos bíblicos.</b></p></div><div class="card role"><h3>📖 Responsable de enseñanza</h3><p>La responsabilidad de la enseñanza está definida, pero su ejercicio puede rotar entre personas preparadas. Prepara, enseña, facilita comprensión y recibe retroalimentación.</p></div><div class="card role"><h3>🌱 Aprendiz</h3><p>Observa, participa, ayuda, asume partes de la reunión y recibe delegación progresiva hasta estar preparado para liderar.</p></div></div><div class="dark" style="margin-top:20px"><h3>Principio de rotación</h3><p>La responsabilidad permanece estable, pero su ejercicio puede rotar entre personas preparadas.</p></div></section>`],
['11. Formar, cuidar y multiplicar',`<section class="screen"><div class="eyebrow">11 · Fruto del proceso</div><h2>El propósito del grupo: formar, cuidar y multiplicar</h2><div class="grid">${[['📖','11.1 Formar discípulos','Es un proceso: Escritura, comprensión, reflexión, comunidad y obediencia práctica.'],['❤️','11.2 Cuidar a las personas','El grupo permite detectar necesidades y acompañar. El líder no sustituye al pastor ni a profesionales cuando se requiere atención especializada.'],['🌎','11.3 Vivir la misión','Oración, relaciones, invitación, testimonio, servicio y conversación sobre el evangelio.'],['🌱','11.4 Reproducir','La multiplicación saludable comienza formando aprendices, delegando funciones y comprobando capacidad para cuidar nuevos participantes.'],['🧭','11.5 Acompañar','La supervisión debe ser apoyo, oración, capacitación, resolución de problemas y rendición de cuentas.']].map(x=>`<div class="card"><div class="icon">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div><div class="band"><img src="${A}oracion-cuidado.jpeg" alt="Cuidado y acompañamiento"><img src="${A}grupo-casa.jpeg" alt="Comunidad en un hogar"></div></section>`],
['12. Supervisión',`<section class="screen"><div class="eyebrow">12 · Acompañamiento</div><h2>¿Quién evalúa qué?</h2><p class="lead">Evaluar no es buscar culpables; es identificar qué está funcionando, qué necesita fortalecerse y cómo seguir creciendo.</p><div class="grid">${[['🧭','Supervisor','Acompaña y evalúa el proceso general. Observa, ora, orienta, capacita, detecta dificultades y ayuda a corregirlas.'],['👥','Líder / facilitador','Evalúa el funcionamiento del grupo: participación, relaciones, aplicación, necesidades, aprendiz y misión.'],['📖','Responsable de enseñanza','Evalúa su enseñanza y recibe retroalimentación: fidelidad bíblica, claridad, participación, aplicación y manejo del grupo.']].map(x=>`<div class="card"><div class="icon">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div><div class="hero" style="margin-top:22px"><div><h3>Preguntas del supervisor</h3><div class="list">${['¿Cumple el grupo su propósito?','¿Participan las personas?','¿Existe crecimiento en conocimiento y obediencia?','¿Se fortalecen las relaciones?','¿Se cuida a las personas?','¿Existe visión misionera?','¿Hay aprendiz o futuros líderes?','¿El líder recibe acompañamiento?','¿Qué problema debe corregirse?','¿Qué debe mantenerse, modificarse o eliminarse?'].map((x,i)=>`<div class="li"><span class="check">${i+1}</span>${x}</div>`).join('')}</div></div><img src="${A}supervision.jpeg" alt="Supervisor acompañando a un líder"></div><h3 style="margin-top:28px">12.1 Indicadores posibles</h3><table><tr><th>Dimensión</th><th>Indicadores</th></tr>${[['Participación','Asistencia, permanencia, participación activa'],['Discipulado','Aplicaciones, testimonios de cambio, prácticas espirituales'],['Relaciones','Cuidado, integración, resolución de conflictos'],['Misión','Personas por quienes se ora, invitados, servicio'],['Liderazgo','Aprendices, delegación, líderes en formación'],['Multiplicación','Nuevos líderes y grupos'],['Salud del líder','Capacitación, acompañamiento, carga sostenible']].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join('')}</table></section>`],
['13. Objetivos',`<section class="screen"><div class="eyebrow">13 · ¿Qué buscamos?</div><h2>Objetivos y evidencias de crecimiento</h2><div class="grid">${[['Espirituales','Crecimiento en Cristo, oración, conocimiento y obediencia.'],['Relacionales','Integración, cuidado, comunión y participación.'],['Misionales','Evangelización y servicio.'],['Reproductivos','Aprendices, nuevos líderes y nuevos grupos.']].map((x,i)=>`<div class="${i===0?'dark':'card'}"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div><div class="band"><img src="${A}evaluacion.jpeg" alt="Evaluación de crecimiento"><div class="dark" style="display:flex;align-items:center"><p style="font-size:24px">Un grupo numéricamente grande puede estar débil espiritualmente, mientras uno pequeño puede estar formando discípulos profundamente.</p></div></div></section>`],
['14. Ciclo anual',`<section class="screen"><div class="eyebrow">14 · Ritmo de desarrollo</div><h2>Ciclo anual propuesto</h2><div class="grid">${[['Preparación','Oración, visión y líderes','Líderes preparados'],['Inicio','Conexión y propósito','Grupo establecido'],['Desarrollo','Palabra, relación y práctica','Crecimiento observable'],['Misión','Evangelización y servicio','Acción hacia afuera'],['Formación','Aprendices y delegación','Líderes en proceso'],['Reproducción','Nuevo grupo / etapa','Multiplicación saludable'],['Evaluación','Salud integral','Ajustes']].map((x,i)=>`<div class="card"><span class="eyebrow">${String(i+1).padStart(2,'0')}</span><h3>${x[0]}</h3><p><b>Enfoque:</b> ${x[1]}</p><p><b>Resultado:</b> ${x[2]}</p></div>`).join('')}</div><div class="flow"><span class="node">Preparar</span><span class="arrow">→</span><span class="node">Iniciar</span><span class="arrow">→</span><span class="node">Desarrollar</span><span class="arrow">→</span><span class="node">Misión</span><span class="arrow">→</span><span class="node">Formar</span><span class="arrow">→</span><span class="node">Reproducir</span><span class="arrow">→</span><span class="node">Evaluar</span></div></section>`],
['15. Riesgos y prevención',`<section class="screen"><div class="eyebrow">15 · Prevención</div><h2>Riesgos, errores y prevención</h2><p class="lead">Anticipar dificultades para proteger la salud del grupo.</p><div class="grid2"><div class="card"><h3>⚠️ Riesgo o error</h3><div class="list">${['Líder habla todo el tiempo','Grupo sin propósito','Mucho conocimiento, poca práctica','Enfoque solo numérico','Líder sobrecargado','Falta de supervisión','Conflictos ignorados','Multiplicación prematura'].map(x=>`<div class="li">⚠️ <b>${x}</b></div>`).join('')}</div></div><div class="dark"><h3>🛡️ Prevención</h3><div class="list">${['Facilitación y preguntas','Propósito escrito y revisado','Aplicación concreta','Indicadores espirituales, relacionales y misionales','Delegación y liderazgo compartido','Mentoría y reuniones periódicas','Intervención temprana','Aprendiz formado y evaluación de madurez'].map(x=>`<div class="li"><span class="check">✓</span>${x}</div>`).join('')}</div></div></div><div class="quote">Un grupo saludable no se mide solamente por cuánto crece, sino por cómo forma, cuida, sirve y reproduce discípulos.</div></section>`],
['16. Conclusiones',`<section class="screen"><div class="eyebrow">16 · Cierre conceptual</div><h2>Una propuesta para formar discípulos</h2><p class="lead">Del encuentro en casa a una vida que se reproduce.</p><div class="grid">${[['Comiskey','Visión celular, evangelización, reproducción y supervisión.'],['Comiskey · Discípulos','Discipulado intencional y misión.'],['Ogden','Discipulado intencional, aplicación y evaluación.'],['McBride','Fundamento bíblico, liderazgo siervo, facilitación, liderazgo compartido y desarrollo grupal.']].map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div><h3 style="margin-top:28px">Nuestra síntesis</h3><div class="flow">${['Visión','Líderes','Formación','Propósito','Palabra + vida','Cuidado','Misión','Aprendices','Supervisión','Evaluación','Reproducción'].map((x,i)=>`${i?'<span class="arrow">→</span>':''}<span class="node">${x}</span>`).join('')}</div><div class="dark" style="margin-top:20px;text-align:center"><p style="font-size:clamp(21px,3vw,32px);font-weight:750">La meta no es producir reuniones, sino discípulos que siguen a Cristo, viven la fe en comunidad, sirven a otros y ayudan a otros a crecer.</p></div></section>`],
['17. Anexos y bibliografía',`<section class="screen"><div class="eyebrow">17 · Herramientas de cierre</div><h2>Anexos operativos</h2><div class="grid"><div class="card"><h3>Ficha básica del grupo</h3><p>Nombre · líder · aprendiz · día/hora · lugar · propósito · supervisor.</p></div><div class="card"><h3>Evaluación mensual</h3><p>Reuniones · participación · Palabra · oración · seguimiento · misión · aprendiz · acompañamiento · problemas · siguiente paso.</p></div><div class="card"><h3>Ruta de formación</h3><p>Identificación → entrevista → formación → capacitación → observación → co-liderazgo → delegación → evaluación → reconocimiento → nuevo aprendiz.</p></div></div><h2 style="margin-top:35px">Bibliografía y fuentes principales</h2><div class="grid">${[['Joel Comiskey','Cómo dirigir un grupo celular con éxito.'],['Joel Comiskey','Haciendo discípulos en la iglesia del siglo XXI.'],['Gregory J. Ogden','Manual del discipulado: Creciendo y ayudando a otros a crecer.'],['Neal F. McBride','Cómo liderar grupos pequeños.']].map(x=>`<div class="card"><h3>${x[0]}</h3><p><em>${x[1]}</em></p></div>`).join('')}</div><div class="dark" style="margin-top:20px"><h3>La Biblia</h3><p>Especialmente Mateo 28:18–20; Marcos 3:13–19; Marcos 9:35; Juan 13; Hechos 2:42–47; Hechos 5:42; Hechos 20:20; Romanos 16:3–5; Efesios 4:11–16; Hebreos 10:24–25; 2 Timoteo 2:2.</p></div></section>`]
];
const wrap=document.getElementById('wrap');wrap.innerHTML=data.map(x=>x[1]).join('');const els=[...document.querySelectorAll('.screen')];const nav=document.getElementById('nav');data.forEach((x,i)=>{const b=document.createElement('button');b.innerHTML=`<span class="num">${String(i+1).padStart(2,'0')}</span>${x[0]}`;b.onclick=()=>go(i);nav.appendChild(b)});const nb=[...nav.children];let cur=0;function go(i){
cur=Math.max(0,Math.min(data.length-1,i));
els.forEach((e,n)=>e.classList.toggle('active',n===cur));
const active=els[cur];
if(active){[...active.querySelectorAll('.card,.approach,.ot-card,.step,.band,.flow .node,.dark')].forEach((el,i)=>el.style.setProperty('--i',i));}
nb.forEach((b,n)=>b.classList.toggle('active',n===cur));
document.getElementById('bar').style.width=(cur/(data.length-1)*100)+'%';
document.getElementById('count').textContent=`${cur+1} / ${data.length}`;
document.getElementById('prevBtn').disabled=cur===0;
document.getElementById('bottomPrev').disabled=cur===0;
document.getElementById('nextBtn').disabled=cur===data.length-1;
document.getElementById('bottomNext').disabled=cur===data.length-1;
scrollTo({top:0,behavior:'smooth'});
document.getElementById('side').classList.remove('open')
}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});document.getElementById('menu').addEventListener('click',()=>{
const app=document.querySelector('.app');
const side=document.getElementById('side');
if(window.matchMedia('(max-width:900px)').matches){
side.classList.toggle('open');
const open=side.classList.contains('open');
document.getElementById('menu').textContent=open?'×':'☰';
document.getElementById('menu').setAttribute('aria-label',open?'Ocultar menú':'Mostrar menú');
}else{
app.classList.toggle('menu-collapsed');
const hidden=app.classList.contains('menu-collapsed');
document.getElementById('menu').textContent=hidden?'☰':'×';
document.getElementById('menu').setAttribute('aria-label',hidden?'Mostrar menú':'Ocultar menú');
}
});
document.getElementById('homeBtn').addEventListener('click',()=>go(0));
document.getElementById('prevBtn').addEventListener('click',()=>go(cur-1));
document.getElementById('nextBtn').addEventListener('click',()=>go(cur+1));
document.getElementById('bottomHome').addEventListener('click',()=>go(0));
document.getElementById('bottomPrev').addEventListener('click',()=>go(cur-1));
document.getElementById('bottomNext').addEventListener('click',()=>go(cur+1));
let fontLevel=0;
document.getElementById('fontDown').addEventListener('click',()=>{
fontLevel=Math.max(-1,fontLevel-1);
document.body.classList.toggle('large-text',fontLevel>0);
});
document.getElementById('fontUp').addEventListener('click',()=>{
fontLevel=Math.min(1,fontLevel+1);
document.body.classList.toggle('large-text',fontLevel>0);
});
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;document.getElementById('install').hidden=false});document.getElementById('install').onclick=async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null}};if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));go(0);
</script></body></html>
